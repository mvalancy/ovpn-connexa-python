# Fast lane: every feature/* PR into dev, and every push to dev.
#
# Deliberately scoped to the unit suite so it stays quick. Lint is NOT gated
# here yet — the tree currently has ~245 flake8 findings, 13 files black would
# reformat and 14 mypy errors. Gating on that today would just wire in a red
# check, and marking it continue-on-error would be worse: a check nobody can
# trust. Tracked separately; add the lint job here once the debt is paid.
name: fast

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The suite imports `cloudconnexa`, which lives under src/ and is only
          # importable once the package itself is installed. requirements.txt
          # alone leaves every test module failing at collection.
          pip install -e .

      - name: Unit tests
        run: python -m pytest tests/unit -q
