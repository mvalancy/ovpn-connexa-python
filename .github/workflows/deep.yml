# Deep lane: dev -> main only. Runs the whole suite plus coverage.
#
# tests/integration skips itself without live Cloud Connexa credentials, and
# tests/functional is a stub, so this is safe on a hosted runner — it just
# means the integration tier is reported as skipped rather than passing. Wire
# real credentials as secrets if that tier should genuinely gate a release.
name: deep

on:
  pull_request:
    branches: [main]

concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The suite imports `cloudconnexa`, which lives under src/ and is only
          # importable once the package itself is installed. requirements.txt
          # alone leaves every test module failing at collection.
          pip install -e .

      - name: Full suite with coverage
        run: python -m pytest tests -q --cov=src/cloudconnexa --cov-report=term-missing

      - name: Show skipped tiers
        if: always()
        run: python -m pytest tests -q -rs | tail -20
